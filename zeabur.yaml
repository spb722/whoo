name: birthday-app
services:
  - name: api
    type: docker
    dockerfile: Dockerfile
    ports:
      - 8000
    env:
      - PROJECT_NAME
      - VERSION
      - API_V1_STR
      - SECRET_KEY
      - ALGORITHM
      - ACCESS_TOKEN_EXPIRE_MINUTES
      - DATABASE_URL
      - DATABASE_PASSWORD
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - GOOGLE_REDIRECT_URI
      - FRONTEND_URL
      - TWILIO_ACCOUNT_SID
      - TWILIO_AUTH_TOKEN
      - TWILIO_FROM_NUMBER